    const formatSeconds = (sec) => {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    };

    const AudioContext = createContext(null);

    const AudioProvider = ({ children }) => {
      const audioRef = useRef(new Audio());
      const [currentLecture, setCurrentLecture] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackError, setPlaybackError] = useState('');
      const playbackErrorText = 'Не удалось запустить аудио. Попробуйте встроенный плеер ниже или откройте запись в Google Drive.';
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [playbackRate, setPlaybackRate] = useState(1);
      const [sleepTimer, setSleepTimer] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [library, setLibrary] = useState(() => {
        try {
          const raw = localStorage.getItem('alfirqa_library_v2');
          return raw ? JSON.parse(raw) : { favorites: [], history: {} };
        } catch {
          return { favorites: [], history: {} };
        }
      });

      useEffect(() => {
        localStorage.setItem('alfirqa_library_v2', JSON.stringify(library));
      }, [library]);

      useEffect(() => {
        const audio = audioRef.current;

        const onTimeUpdate = () => {
          setCurrentTime(audio.currentTime);
          if (currentLecture && Math.floor(audio.currentTime) % 4 === 0) {
            updateProgress(currentLecture.id, audio.currentTime, audio.duration);
          }
        };

        const onLoadedMeta = () => {
          setDuration(audio.duration || 0);
        };

        const onEnded = () => {
          if (currentLecture) {
            updateProgress(currentLecture.id, audio.duration, audio.duration, true);
          }
          nextLesson();
        };

        const onPlay = () => {
          setIsPlaying(true);
          setPlaybackError('');
        };
        const onPause = () => setIsPlaying(false);
        const onError = () => {
          setIsPlaying(false);
          setPlaybackError(playbackErrorText);
        };

        audio.addEventListener('timeupdate', onTimeUpdate);
        audio.addEventListener('loadedmetadata', onLoadedMeta);
        audio.addEventListener('ended', onEnded);
        audio.addEventListener('play', onPlay);
        audio.addEventListener('pause', onPause);
        audio.addEventListener('error', onError);

        return () => {
          audio.removeEventListener('timeupdate', onTimeUpdate);
          audio.removeEventListener('loadedmetadata', onLoadedMeta);
          audio.removeEventListener('ended', onEnded);
          audio.removeEventListener('play', onPlay);
          audio.removeEventListener('pause', onPause);
          audio.removeEventListener('error', onError);
        };
      }, [currentLecture]);

      useEffect(() => {
        const audio = audioRef.current;
        let restorePosition = null;
        try {
          const lastSaved = localStorage.getItem('alfirqa_last_played');
          if (!lastSaved) return;
          const parsed = JSON.parse(lastSaved);
          const found = LECTURES_DATA.find(l => l.id === parsed.id);
          if (!found) return;

          const savedTime = Math.max(0, Number(parsed.time) || 0);
          setCurrentLecture(found);
          setCurrentTime(savedTime);
          restorePosition = () => {
            if (audio.src !== found.audioUrl) return;
            const mediaDuration = Number.isFinite(audio.duration) ? audio.duration : 0;
            setDuration(mediaDuration);
            if (savedTime > 0) {
              try {
                const position = mediaDuration > 0 ? Math.min(savedTime, Math.max(0, mediaDuration - 0.25)) : savedTime;
                audio.currentTime = position;
                setCurrentTime(position);
              } catch (error) {
                console.warn('Не удалось восстановить позицию аудио', error);
              }
            }
          };
          audio.addEventListener('loadedmetadata', restorePosition, { once: true });
          audio.src = found.audioUrl;
        } catch (error) {
          console.warn('Не удалось восстановить последнюю лекцию', error);
        }

        return () => {
          if (restorePosition) audio.removeEventListener('loadedmetadata', restorePosition);
        };
      }, []);

      useEffect(() => {
        if (!sleepTimer) return;
        const interval = setInterval(() => {
          setSleepTimer(prev => {
            if (prev <= 1) {
              audioRef.current.pause();
              setIsPlaying(false);
              return null;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [sleepTimer]);

      const updateProgress = (lectureId, pos, dur, completed = false) => {
        const isComp = completed || (dur > 0 && pos / dur > 0.92);
        setLibrary(prev => ({
          ...prev,
          history: {
            ...prev.history,
            [lectureId]: {
              lastPos: pos,
              dur: dur || 0,
              completed: isComp,
              timestamp: Date.now()
            }
          }
        }));

        localStorage.setItem('alfirqa_last_played', JSON.stringify({
          id: lectureId,
          time: pos
        }));
      };

      const startPlayback = (audio) => {
        setPlaybackError('');
        try {
          const playRequest = audio.play();
          if (playRequest && typeof playRequest.then === 'function') {
            playRequest.then(() => {
              setIsPlaying(true);
              setPlaybackError('');
            }).catch((error) => {
              console.warn('Не удалось запустить аудио', error);
              setIsPlaying(false);
              setPlaybackError(playbackErrorText);
            });
          } else {
            setIsPlaying(true);
          }
        } catch (error) {
          console.warn('Не удалось запустить аудио', error);
          setIsPlaying(false);
          setPlaybackError(playbackErrorText);
        }
      };

      const playLecture = (lecture) => {
        const audio = audioRef.current;
        if (currentLecture?.id === lecture.id) {
          if (isPlaying) {
            audio.pause();
            setIsPlaying(false);
          } else {
            startPlayback(audio);
          }
          return;
        }

        audio.pause();
        setPlaybackError('');
        setCurrentLecture(lecture);
        audio.playbackRate = playbackRate;

        const hist = library.history[lecture.id];
        const startPos = Math.max(0, Number((hist && !hist.completed) ? hist.lastPos : 0) || 0);
        setDuration(0);
        setCurrentTime(startPos);
        if (startPos > 0) {
          const restorePosition = () => {
            if (audio.src !== lecture.audioUrl) return;
            try {
              const mediaDuration = Number.isFinite(audio.duration) ? audio.duration : 0;
              const position = mediaDuration > 0 ? Math.min(startPos, Math.max(0, mediaDuration - 0.25)) : startPos;
              audio.currentTime = position;
              setCurrentTime(position);
            } catch (error) {
              console.warn('Не удалось восстановить позицию аудио', error);
            }
          };
          audio.addEventListener('loadedmetadata', restorePosition, { once: true });
        }
        audio.src = lecture.audioUrl;

        startPlayback(audio);
      };

      const togglePlay = () => {
        if (!currentLecture) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          startPlayback(audioRef.current);
        }
      };

      const seek = (seconds) => {
        if (!audioRef.current || !currentLecture) return;
        audioRef.current.currentTime = seconds;
        setCurrentTime(seconds);
        updateProgress(currentLecture.id, seconds, duration);
      };

      const changeSpeed = (rate) => {
        audioRef.current.playbackRate = rate;
        setPlaybackRate(rate);
      };

      const nextLesson = () => {
        if (!currentLecture) return;
        const idx = LECTURES_DATA.findIndex(l => l.id === currentLecture.id);
        if (idx !== -1 && idx < LECTURES_DATA.length - 1) {
          playLecture(LECTURES_DATA[idx + 1]);
        }
      };

      const prevLesson = () => {
        if (!currentLecture) return;
        const idx = LECTURES_DATA.findIndex(l => l.id === currentLecture.id);
        if (idx > 0) {
          playLecture(LECTURES_DATA[idx - 1]);
        }
      };

      const toggleFavorite = (id) => {
        setLibrary(prev => {
          const exists = prev.favorites.includes(id);
          return {
            ...prev,
            favorites: exists ? prev.favorites.filter(x => x !== id) : [...prev.favorites, id]
          };
        });
      };

      return (
        <AudioContext.Provider value={{
          currentLecture,
          isPlaying,
          playbackError,
          currentTime,
          duration,
          playbackRate,
          sleepTimer,
          isModalOpen,
          library,
          setIsModalOpen,
          playLecture,
          togglePlay,
          seek,
          changeSpeed,
          setSleepTimer,
          nextLesson,
          prevLesson,
          toggleFavorite
        }}>
          {children}
        </AudioContext.Provider>
      );
    };

    const useAudio = () => useContext(AudioContext);

    const Navbar = ({ activeTab, setActiveTab, isDark, toggleTheme, favoritesCount }) => {

      ];

      return (
        <header className="sticky top-0 z-40 border-b backdrop-blur-md bg-[#F2F6FA]/90 dark:bg-[#000000]/85 border-[#E2E8F0] dark:border-[#1F1F1F] transition-colors">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div 
              onClick={() => setActiveTab('lectures')}
              className="cursor-pointer flex items-baseline gap-2.5 group select-none"
            >
              <span className="font-fraunces text-lg sm:text-xl font-semibold tracking-tight text-[#111820] dark:text-[#F5F5F5] group-hover:text-[#B8874A] dark:group-hover:text-[#E0821E] transition">
                AL-FIRQA
              </span>
              <span className="font-amiri text-base text-[#697481] dark:text-[#969696] font-normal" dir="rtl">
                الفرقة الناجية
              </span>
            </div>

            <nav className="hidden md:flex items-center gap-7 text-xs font-medium uppercase tracking-wider text-[#697481] dark:text-[#969696]">
              {navItems.map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`hover:text-[#111820] dark:hover:text-[#F5F5F5] transition relative py-1 ${activeTab === item.id ? 'text-[#111820] dark:text-[#F5F5F5] font-semibold' : ''}`}

            </div>
          </div>

          <div className="divide-y divide-[#E2E8F0] dark:divide-[#1F1F1F] border-t border-b border-[#E2E8F0] dark:border-[#1F1F1F]">
            {filteredLectures.length === 0 ? (
              <div className="py-16 text-center text-[#697481] dark:text-[#969696] text-sm">
                По вашему запросу материалов не найдено.
              </div>
            ) : (
              filteredLectures.map(lec => {
                const isCurrent = currentLecture?.id === lec.id;
                const progressItem = library.history[lec.id];
                const isDone = progressItem?.completed;

                return (
                  <div
                    key={lec.id}
                    className={`py-4 sm:py-5 flex items-center justify-between gap-4 transition group ${isCurrent ? 'bg-[#EAEEF3]/60 dark:bg-[#181818]/70 px-3 -mx-3 rounded-md' : 'hover:bg-[#FFFFFF]/40 dark:hover:bg-[#101010]/50'}`}
                  >
                    <div className="flex items-center gap-4 min-w-0 flex-1">
                      <button
                        onClick={() => playLecture(lec)}
                        className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 border transition ${isCurrent && isPlaying ? 'bg-[#B8874A] dark:bg-[#E0821E] text-white border-transparent' : 'border-[#E2E8F0] dark:border-[#1F1F1F] bg-[#FFFFFF] dark:bg-[#101010] text-[#111820] dark:text-[#F5F5F5] group-hover:border-[#B8874A] dark:group-hover:border-[#E0821E]'}`}
                      >
                        {isCurrent && isPlaying ? (
                          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                          </svg>
                        ) : (
                          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" className="translate-x-0.5">
                            <path d="M8 5v14l11-7z"/>
                          </svg>
                        )}
                      </button>

                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                          <span className="text-[11px] font-mono text-[#697481] dark:text-[#969696]">
                            Урок {lec.lessonNumber}
                          </span>
                          {isDone && (
                            <span className="text-[10px] px-1.5 py-0.2 rounded bg-green-500/10 text-green-600 dark:text-green-400 font-mono">
                              Прослушано
                            </span>
                          )}
                          <span className="text-[11px] font-mono text-[#B8874A] dark:text-[#E0821E]">
                            • {CATEGORIES[lec.category]}
                          </span>
                        </div>

                        <h3 
                          onClick={() => playLecture(lec)}
                          className={`text-sm sm:text-base font-medium truncate cursor-pointer transition ${isCurrent ? 'text-[#B8874A] dark:text-[#E0821E]' : 'text-[#111820] dark:text-[#F5F5F5] group-hover:text-[#B8874A] dark:group-hover:text-[#E0821E]'}`}
                        >
                          {lec.title}
                        </h3>

                        <p className="text-xs text-[#697481] dark:text-[#969696] truncate">
                          {lec.cycleTitle} • {lec.author}
                        </p>
                      </div>
                    </div>

                    <div className="shrink-0 text-right">
                      <div className="text-xs font-mono text-[#697481] dark:text-[#969696]">
                        {formatSeconds(lec.duration)}
                      </div>
                      {lec.titleArabic && (
                        <div className="text-xs font-amiri text-[#697481] dark:text-[#969696] hidden sm:block" dir="rtl">
                          {lec.titleArabic}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    };

    const CyclesView = ({ onSelectCycle }) => {
      return (
        <div className="space-y-10 pb-28">
          <div className="pt-6 sm:pt-10 border-b border-[#E2E8F0] dark:border-[#1F1F1F] pb-8">
            <h1 className="font-fraunces text-3xl sm:text-5xl font-semibold tracking-tight text-[#111820] dark:text-[#F5F5F5]">
              Учебные циклы
            </h1>
            <p className="text-sm sm:text-base text-[#697481] dark:text-[#969696] mt-2">
              Систематическое прохождение богословских матнов от простого к глубокому.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {CYCLES_DATA.map(cycle => (
              <div 
                key={cycle.id}
                onClick={() => onSelectCycle(cycle.id)}
                className="cursor-pointer border border-[#E2E8F0] dark:border-[#1F1F1F] bg-[#FFFFFF] dark:bg-[#101010] p-6 rounded-lg hover:border-[#B8874A] dark:hover:border-[#E0821E] transition group flex flex-col justify-between"
              >
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs px-2.5 py-1 rounded bg-[#F2F6FA] dark:bg-[#181818] text-[#B8874A] dark:text-[#E0821E]">
                      ЦИКЛ {cycle.accentNum}
                    </span>
                    <span className="text-xs font-mono text-[#697481] dark:text-[#969696]">
                      {CATEGORIES[cycle.category]}
                    </span>
                  </div>

                  <div>
                    {cycle.titleArabic && (
                      <h4 className="font-amiri text-lg text-[#697481] dark:text-[#969696]" dir="rtl">
                        {cycle.titleArabic}
                      </h4>
                    )}
                    <h3 className="font-fraunces text-xl font-semibold text-[#111820] dark:text-[#F5F5F5] group-hover:text-[#B8874A] dark:group-hover:text-[#E0821E] transition">
                      {cycle.title}
                    </h3>
                  </div>

                  <p className="text-xs sm:text-sm text-[#697481] dark:text-[#969696] leading-relaxed line-clamp-3">
                    {cycle.desc}
                  </p>
                </div>

                <div className="pt-6 mt-6 border-t border-[#E2E8F0] dark:border-[#1F1F1F] flex items-center justify-between text-xs font-mono text-[#697481] dark:text-[#969696]">
                  <span>{cycle.lessonsCount} уроков • {cycle.totalDuration}</span>
                  <span className="text-[#111820] dark:text-[#F5F5F5] group-hover:translate-x-1 transition font-medium">
                    Открыть цикл →
                  </span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const SingleCycleDetail = ({ cycleId, onBack }) => {
      const { playLecture, currentLecture, isPlaying } = useAudio();
      const cycle = CYCLES_DATA.find(c => c.id === cycleId);
      const cycleLessons = LECTURES_DATA.filter(l => l.cycleId === cycleId);

      if (!cycle) return null;

      return (
        <div className="space-y-10 pb-28">
          <div className="pt-4">
            <button 
              onClick={onBack}
              className="text-xs font-mono text-[#697481] dark:text-[#969696] hover:text-[#111820] dark:hover:text-[#F5F5F5] transition flex items-center gap-1"
            >
              ← Назад ко всем циклам
            </button>
          </div>

          <div className="border border-[#E2E8F0] dark:border-[#1F1F1F] bg-[#FFFFFF] dark:bg-[#101010] p-6 sm:p-10 rounded-lg space-y-4">
            <span className="text-xs font-mono px-3 py-1 rounded bg-[#F2F6FA] dark:bg-[#181818] text-[#B8874A] dark:text-[#E0821E]">
              {CATEGORIES[cycle.category]}
            </span>

            {cycle.titleArabic && (
              <h3 className="font-amiri text-2xl text-[#697481] dark:text-[#969696]" dir="rtl">
                {cycle.titleArabic}
              </h3>
            )}

            <h1 className="font-fraunces text-2xl sm:text-4xl font-semibold text-[#111820] dark:text-[#F5F5F5]">
              {cycle.title}
            </h1>

            <p className="text-sm text-[#697481] dark:text-[#969696] leading-relaxed max-w-3xl">
              {cycle.desc}
            </p>

            <div className="pt-4 flex items-center gap-4 text-xs font-mono text-[#697481] dark:text-[#969696]">
              <span>Преподаватель: {cycle.author}</span>
              <span>•</span>
              <span>Всего уроков: {cycle.lessonsCount}</span>
              <span>•</span>
              <span>{cycle.totalDuration}</span>
            </div>
          </div>

          <div className="space-y-2">
            <h2 className="text-sm font-mono uppercase tracking-wider text-[#697481] dark:text-[#969696] mb-4">
              Содержание цикла ({cycleLessons.length})
            </h2>

            <div className="divide-y divide-[#E2E8F0] dark:divide-[#1F1F1F] border border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg bg-[#FFFFFF] dark:bg-[#101010]">
              {cycleLessons.map(lec => {
                const isCurrent = currentLecture?.id === lec.id;
                return (
                  <div 
                    key={lec.id}
                    onClick={() => playLecture(lec)}
                    className="p-4 sm:p-5 flex items-center justify-between gap-4 cursor-pointer hover:bg-[#F2F6FA] dark:hover:bg-[#181818] transition"
                  >
                    <div className="flex items-center gap-3.5 min-w-0">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-mono border ${isCurrent && isPlaying ? 'bg-[#B8874A] dark:bg-[#E0821E] text-white border-transparent' : 'border-[#E2E8F0] dark:border-[#1F1F1F]'}`}>
                        {lec.lessonNumber}
                      </div>
                      <div className="min-w-0">
                        <p className={`text-sm font-medium truncate ${isCurrent ? 'text-[#B8874A] dark:text-[#E0821E]' : 'text-[#111820] dark:text-[#F5F5F5]'}`}>
                          {lec.title}
                        </p>
                        <p className="text-xs text-[#697481] dark:text-[#969696] truncate">
                          {lec.description}
                        </p>
                      </div>
                    </div>
                    <span className="text-xs font-mono text-[#697481] dark:text-[#969696] shrink-0">
                      {formatSeconds(lec.duration)}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    const AuthorView = ({ onSelectCycle }) => {
      return (
        <div className="space-y-10 pb-28">
          <div className="pt-6 sm:pt-10 border-b border-[#E2E8F0] dark:border-[#1F1F1F] pb-8">
            <h1 className="font-fraunces text-3xl sm:text-5xl font-semibold tracking-tight text-[#111820] dark:text-[#F5F5F5]">
              {AUTHOR_INFO.name}
            </h1>
            <p className="font-amiri text-xl text-[#697481] dark:text-[#969696] mt-1" dir="rtl">
              {AUTHOR_INFO.nameArabic}
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div className="md:col-span-1 space-y-6">
              <div className="p-6 rounded-lg border border-[#E2E8F0] dark:border-[#1F1F1F] bg-[#FFFFFF] dark:bg-[#101010] space-y-4">
                <h3 className="text-xs font-mono uppercase tracking-wider text-[#697481] dark:text-[#969696]">
                  Сведения об авторе
                </h3>
                <p className="text-xs sm:text-sm text-[#111820] dark:text-[#F5F5F5] leading-relaxed">
                  {AUTHOR_INFO.bio}
                </p>
                <div className="pt-4 border-t border-[#E2E8F0] dark:border-[#1F1F1F] space-y-2 text-xs font-mono text-[#697481] dark:text-[#969696]">
                  <div>Циклов в архиве: <span className="text-[#111820] dark:text-[#F5F5F5]">{AUTHOR_INFO.totalCycles}</span></div>
                  <div>Всего уроков: <span className="text-[#111820] dark:text-[#F5F5F5]">{AUTHOR_INFO.totalLectures}</span></div>
                </div>
              </div>
            </div>

            <div className="md:col-span-2 space-y-4">
              <h3 className="text-xs font-mono uppercase tracking-wider text-[#697481] dark:text-[#969696]">
                Учебные курсы автора
              </h3>
              <div className="space-y-3">
                {CYCLES_DATA.map(c => (
                  <div
                    key={c.id}
                    onClick={() => onSelectCycle(c.id)}
                    className="p-5 rounded-lg border border-[#E2E8F0] dark:border-[#1F1F1F] bg-[#FFFFFF] dark:bg-[#101010] flex items-center justify-between cursor-pointer hover:border-[#B8874A] dark:hover:border-[#E0821E] transition group"
                  >
                    <div>
                      <span className="text-[11px] font-mono text-[#B8874A] dark:text-[#E0821E]">{CATEGORIES[c.category]}</span>
                      <h4 className="text-sm sm:text-base font-medium text-[#111820] dark:text-[#F5F5F5] group-hover:text-[#B8874A] dark:group-hover:text-[#E0821E] transition">
                        {c.title}
                      </h4>
                      <p className="text-xs text-[#697481] dark:text-[#969696] mt-0.5">{c.lessonsCount} уроков • {c.totalDuration}</p>
                    </div>
                    <span className="text-xs font-mono text-[#697481] dark:text-[#969696] group-hover:translate-x-1 transition">
                      Перейти →
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const LibraryView = ({ onSelectCycle }) => {
      const { library, playLecture } = useAudio();
      const favoriteLectures = LECTURES_DATA.filter(l => library.favorites.includes(l.id));
      const historyKeys = Object.keys(library.history);

      return (
        <div className="space-y-10 pb-28">
          <div className="pt-6 sm:pt-10 border-b border-[#E2E8F0] dark:border-[#1F1F1F] pb-8">
            <h1 className="font-fraunces text-3xl sm:text-5xl font-semibold tracking-tight text-[#111820] dark:text-[#F5F5F5]">
              Моя библиотека
            </h1>
            <p className="text-sm sm:text-base text-[#697481] dark:text-[#969696] mt-2">
              Сохраненный прогресс, избранные уроки и история прослушивания на этом устройстве.
            </p>
          </div>

          <div className="space-y-4">
            <h2 className="text-xs font-mono uppercase tracking-wider text-[#697481] dark:text-[#969696]">
              Избранные лекции ({favoriteLectures.length})
            </h2>

            {favoriteLectures.length === 0 ? (
              <div className="p-8 border border-dashed border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg text-center text-xs text-[#697481] dark:text-[#969696]">
                Вы пока не добавили ни одной лекции в закладки. Нажмите иконку закладки в плеере, чтобы сохранить урок.
              </div>
            ) : (
              <div className="divide-y divide-[#E2E8F0] dark:divide-[#1F1F1F] border border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg bg-[#FFFFFF] dark:bg-[#101010]">
                {favoriteLectures.map(lec => (
                  <div
                    key={lec.id}
                    onClick={() => playLecture(lec)}
                    className="p-4 flex items-center justify-between cursor-pointer hover:bg-[#F2F6FA] dark:hover:bg-[#181818] transition"
                  >
                    <div>
                      <p className="text-sm font-medium text-[#111820] dark:text-[#F5F5F5]">{lec.title}</p>
                      <p className="text-xs text-[#697481] dark:text-[#969696]">{lec.cycleTitle} • Урок {lec.lessonNumber}</p>
                    </div>
                    <span className="text-xs font-mono text-[#697481] dark:text-[#969696]">
                      {formatSeconds(lec.duration)}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="space-y-4">
            <h2 className="text-xs font-mono uppercase tracking-wider text-[#697481] dark:text-[#969696]">
              Недавняя активность ({historyKeys.length})
            </h2>

            {historyKeys.length === 0 ? (
              <div className="p-8 border border-dashed border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg text-center text-xs text-[#697481] dark:text-[#969696]">
                История прослушивания пуста. Начните слушать любой урок из архива.
              </div>
            ) : (
              <div className="divide-y divide-[#E2E8F0] dark:divide-[#1F1F1F] border border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg bg-[#FFFFFF] dark:bg-[#101010]">
                {historyKeys.map(id => {
                  const lec = LECTURES_DATA.find(x => x.id === id);
                  const entry = library.history[id];
                  if (!lec) return null;
                  const pct = entry.dur > 0 ? Math.round((entry.lastPos / entry.dur) * 100) : 0;

                  return (
                    <div
                      key={id}
                      onClick={() => playLecture(lec)}
                      className="p-4 flex items-center justify-between gap-4 cursor-pointer hover:bg-[#F2F6FA] dark:hover:bg-[#181818] transition"
                    >
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-medium text-[#111820] dark:text-[#F5F5F5] truncate">{lec.title}</p>
                        <p className="text-xs text-[#697481] dark:text-[#969696]">{lec.cycleTitle}</p>
                        <div className="w-full max-w-xs h-1 bg-black/10 dark:bg-white/10 rounded mt-2">
                          <div className="h-full bg-[#B8874A] dark:bg-[#E0821E] rounded" style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                      <div className="text-right shrink-0">
                        <span className="text-xs font-mono text-[#697481] dark:text-[#969696]">
                          {entry.completed ? 'Завершен' : `${pct}%`}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    };

    const AboutView = () => {
      return (
        <div className="space-y-8 pb-28 max-w-3xl">
          <div className="pt-6 sm:pt-10 border-b border-[#E2E8F0] dark:border-[#1F1F1F] pb-8">
            <h1 className="font-fraunces text-3xl sm:text-5xl font-semibold tracking-tight text-[#111820] dark:text-[#F5F5F5]">
              О платформе
            </h1>
            <p className="font-amiri text-2xl text-[#697481] dark:text-[#969696] mt-2" dir="rtl">
              الفرقة الناجية — أرشيف المحاضرات الإسلامية
            </p>
          </div>

          <div className="space-y-6 text-sm text-[#111820] dark:text-[#F5F5F5] leading-relaxed">
            <p>
              <strong>AL-FIRQA AN-NAJIYA</strong> — это профессиональный цифровой архив исламских аудиолекций, созданный по стандартам современных медиа-библиотек редких книг и академических платформ.
            </p>
            <p>
              Наша цель — предоставить студентам и искренним искателям знаний удобный, выверенный инструмент для последовательного изучения Корана, Сунны и трудов признанных ученых без отвлекающих декоративных элементов и рекламы.
            </p>

            <div className="p-6 border border-[#E2E8F0] dark:border-[#1F1F1F] rounded-lg bg-[#FFFFFF] dark:bg-[#101010] space-y-3 font-mono text-xs">
              <div className="text-[#B8874A] dark:text-[#E0821E] font-semibold uppercase">Принципы платформы:</div>
              <div>• Строгое следование Корану и Сунне в понимании праведных предшественников (Саляф ас-Салих).</div>
              <div>• Академическая точность в сохранении авторских прав и передаче матнов.</div>
              <div>• Полная автономность работы: сохранение прогресса и времени без навязчивой регистрации.</div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('lectures');
      const [selectedCycleId, setSelectedCycleId] = useState(null);
      const [isDark, setIsDark] = useState(true);

      const toggleTheme = () => {
        setIsDark(prev => {
          const next = !prev;
          if (next) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          return next;
        });
      };

      const handleSelectCycle = (id) => {
        setSelectedCycleId(id);
        setActiveTab('cycle-detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <AudioProvider>
          <div className="min-h-screen flex flex-col justify-between">
            <div>
              <Navbar 
                activeTab={activeTab} 
                setActiveTab={(tab) => {
                  setActiveTab(tab);
                  if (tab !== 'cycle-detail') setSelectedCycleId(null);
                }} 
                isDark={isDark} 
                toggleTheme={toggleTheme}
                favoritesCount={0}
              />

              <main className="max-w-7xl mx-auto px-4 sm:px-6">
                {activeTab === 'lectures' && <LecturesView onSelectCycle={handleSelectCycle} />}
                {activeTab === 'cycles' && <CyclesView onSelectCycle={handleSelectCycle} />}
                {activeTab === 'cycle-detail' && selectedCycleId && (
                  <SingleCycleDetail 
                    cycleId={selectedCycleId} 
                    onBack={() => setActiveTab('cycles')} 
                  />
                )}
                {activeTab === 'author' && <AuthorView onSelectCycle={handleSelectCycle} />}
                {activeTab === 'library' && <LibraryView onSelectCycle={handleSelectCycle} />}
                {activeTab === 'about' && <AboutView />}
              </main>
            </div>

            <PlayerDock />
            <EditorialPlayerModal />
          </div>
        </AudioProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
